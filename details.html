<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Details</title>
  <link rel="stylesheet" href="options/bulma.css">
  <style>
    .probability-bar {
      position: relative;
      height: 1.75rem;
      overflow: hidden;
      border: 1px solid var(--bulma-border);
      border-radius: var(--bulma-radius-small);
      background: var(--bulma-background);
    }
    .probability-fill {
      height: 100%;
      background: var(--bulma-success);
      opacity: 0.35;
    }
    .probability-bar.is-danger .probability-fill {
      background: var(--bulma-danger);
    }
    .probability-value {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bulma-text-strong);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title" id="subject"></h1>
      <div id="rules"></div>
      <div class="buttons mt-4">
        <button class="button is-danger" id="clear">Clear Cache</button>
      </div>
    </div>
  </section>
  <script type="module" src="details.js"></script>
</body>
</html>
